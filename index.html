<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Studio Vidéo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
    h1 { text-align: center; color: #4CAF50; }
    .card { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    label { display: block; margin-bottom: 8px; }
    input[type="file"], input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #333; background: #2b2b2b; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Mon Studio Vidéo</h1>
  <div class="card">
    <label>Clé API Hugging Face (Optionnel) :</label>
    <input type="text" id="apiKey" placeholder="hf_xxxxxxxxxxxxxxxxx">
  </div>
  <div class="card">
    <label>Image Source (Portrait) :</label>
    <input type="file" id="sourceImg" accept="image/*">
  </div>
  <div class="card">
    <label>Vidéo de mouvement :</label>
    <input type="file" id="driverVid" accept="video/*">
  </div>
  <button onclick="alert('Configuration prête !')">Générer la vidéo</button>
</body>
</html>
